<!-- ==========================================================
     GALERIA DE DESTAQUE (PÁGINA INICIAL)
     Exibe uma seleção fixa de 30 imagens do portfólio
     (arquivos /img/portfolio/001.jpg até 030.jpg).

     A classe "galeria--random" é lida pelo script.js, que
     embaralha a ordem dessas imagens a cada carregamento da
     página (função embaralharGalerias()).

     OTIMIZAÇÃO: as 4 primeiras imagens ficam com carregamento
     "eager" (padrão do navegador, prioridade normal/alta) por
     serem as que aparecem primeiro na tela antes do JS
     embaralhar a ordem. As demais usam loading="lazy", ou seja,
     só são baixadas quando o usuário rola até perto delas —
     economiza banda de quem não rola a página inteira.
     decoding="async" evita que a decodificação da imagem trave
     a renderização do restante da página.
========================================================== -->
<div class="galeria galeria--random">
