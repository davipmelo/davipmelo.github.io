layout: default
title: DAVI MELO
container_class: "galeria--index"
---

<main>
  <nav class="menu-principal">
    <h3><a href="/pages/blog.html">BLOG</a></h3>
    <h3><a href="/pages/archive.html">ARCHIVE</a></h3>
    <h3>
      <a href="https://www.instagram.com/davimelofoto/" target="_blank" rel="noopener noreferrer">
        INSTAGRAM
      </a>
    </h3>
  </nav>

  <div class="galeria galeria--random">
    {% for i in (1..33) %}
      {% assign numero = i | prepend: '000' | slice: -3, 3 %}
      {% if forloop.index <= 2 %}
        <img src="/img/portfolio/{{ numero }}.jpg" alt="Foto {{ i }} do portfólio" decoding="async">
      {% else %}
        <img src="/img/portfolio/{{ numero }}.jpg" alt="Foto {{ i }} do portfólio" loading="lazy" decoding="async">
      {% endif %}
    {% endfor %}
  </div>
</main>
