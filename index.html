<!-- ==========================================================
     GALERIA DE DESTAQUE (PÁGINA INICIAL)
     Exibe as 30 imagens do portfólio (/img/portfolio/001.jpg
     até 030.jpg).

     Antes eram 30 linhas de <img> escritas à mão. Trocamos por
     um loop do Jekyll (Liquid): se um dia você adicionar ou
     remover fotos do portfólio, basta ajustar o número "30"
     abaixo em vez de editar/apagar <img> uma por uma - mesma
     ideia do "totalImagens" usado no script.js para o Archive.

     "loading=lazy" adia o carregamento das imagens que ainda
     não apareceram na tela, deixando a primeira exibição da
     página mais rápida.

     A classe "galeria--random" é lida pelo script.js, que
     embaralha a ordem dessas imagens a cada carregamento da
     página (função embaralharGalerias()).
========================================================== -->
<div class="galeria galeria--random">
  {% for i in (1..33) %}
    {% assign numero = i | prepend: '000' | slice: -3, 3 %}
    <img src="/img/portfolio/{{ numero }}.jpg" alt="Imagem {{ i }}" loading="lazy">
  {% endfor %}
</div>
