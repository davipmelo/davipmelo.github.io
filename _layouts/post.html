---
layout: default
---
<main>
  <a href="/pages/blog.html" class="botao-voltar">Voltar para o blog</a>
  
  <article class="postagem-blog">
    <h1>{{ page.title }}</h1>
    <p class="data-post">{{ page.date | date: "%d/%m/%Y" }}</p>
    
    <div class="conteudo-post">
      {{ content }}
    </div>
  </article>
</main>
