<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Puxa o título da página ou cai para o nome do site -->
  <title>{{ page.title | default: site.name }}</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>
<body>

  <!-- O Jekyll agora vai puxar a classe específica de cada página -->
  <div class="container {{ page.container_class }}">
    
    {% include header.html %}
    
    {{ content }}
    
<!-- Link adicionado logo abaixo do conteúdo de todas as páginas -->
    <div class="voltar-topo">
      <a href="#">Voltar para o topo</a>
    </div>

    {% include footer.html %}
    
  </div>

</body>
</html>
