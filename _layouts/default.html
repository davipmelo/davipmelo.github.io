<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{{ page.title | default: site.name }}</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v={{ site.time | date: '%s' }}">
  <script src="/frases.js?v={{ site.time | date: '%s' }}" defer></script>
  <script src="/script.js?v={{ site.time | date: '%s' }}" defer></script>
</head>
<body>

  <div class="container {{ page.container_class }}">
    {% include header.html %}
    
    {{ content }}
    
    <div class="voltar-topo">
      <a href="#">Voltar para o topo</a>
    </div>

    {% include footer.html %}
  </div>

</body>
</html>
