<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Puxa o título da página ou cai para o nome do site -->
  <title>{{ page.title | default: site.name }}</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>
<body>

  <div class="container galeria--index">
    
    <!-- O Jekyll insere seu menu de _includes/header.html aqui -->
    {% include header.html %}
    
    <!-- O Jekyll insere o conteúdo do seu novo index.html aqui -->
    {{ content }}
    
    <!-- O Jekyll insere seu rodapé de _includes/footer.html aqui -->
    {% include footer.html %}
    
  </div>

</body>
</html>
